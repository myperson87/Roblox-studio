name: Virtual Gaming Server - Monect Edition

on:
  workflow_dispatch: # Allows you to manually launch the virtual instance from the GitHub Actions UI

jobs:
  secure-rdp:
    runs-on: windows-2025 # Official valid image providing a Windows 11 matching environment
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          echo Enabling Remote Desktop services...
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          
          echo Cleaning and updating firewall configurations...
          netsh advfirewall firewall delete rule name="RDP-Tailscale" >nul 2>&1
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          echo Restarting TermService...
          net stop TermService /y
          net start TermService

      - name: Create RDP User with Secure Password
        shell: cmd
        run: |
          echo Generating administrative user account credentials...
          net user RDP "G@meOn2026!" /add /expires:never
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          
          echo RDP_USER=RDP >> %GITHUB_ENV%
          echo RDP_PASS=G@meOn2026! >> %GITHUB_ENV%

      - name: Install Tailscale VPN
        shell: cmd
        run: |
          echo Downloading Tailscale Installer using native Curl...
          curl -L "https://tailscale.com" -o "%TEMP%\tailscale.msi"
          
          echo Running silent background installation...
          msiexec.exe /i "%TEMP%\tailscale.msi" /quiet /norestart /wait
          
          echo Cleaning installer temporary fragments...
          del "%TEMP%\tailscale.msi" /q /f

      - name: Establish Tailscale Connection
        shell: cmd
        run: |
          echo Connecting runner instance node to Tailscale mesh fabric...
          "%ProgramFiles%\Tailscale\tailscale.exe" up --authkey=\${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-gaming-runner-%GITHUB_RUN_ID%

      - name: Retrieve Tailscale IP Address Allocation
        shell: powershell
        run: |
          Write-Host "Waiting for private network adapter configuration..."
          \$tsIP = \(null\)retries = 0
          while (-not tsIP -and retries -lt 12) {
              \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              \$retries++
          }
          
          if (-not \$tsIP) {
              Write-Error "Tailscale mesh tunnel interface timed out!"
              exit 1
          }
          Write-Host "Assigned Virtual Target IP: \$tsIP"
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV

      - name: Download & Silently Install Monect Receiver
        shell: cmd
        run: |
          echo Downloading Monect system payload mirror branch...
          curl -L "https://githubusercontent.com" -o "%TEMP%\PCRemoteReceiverSetup.exe"
          
          echo Running silent Monect installation manager backend process...
          "%TEMP%\PCRemoteReceiverSetup.exe" /S
          
          echo Cleaning temporary installation packages...
          del "%TEMP%\PCRemoteReceiverSetup.exe" /q /f
          echo Monect system platform initialized safely.

      - name: Open Network Ports for Monect Connection
        shell: cmd
        run: |
          echo Opening dedicated input communication lines for Monect Server mapping...
          netsh advfirewall firewall add rule name="MonectTCP" dir=in action=allow protocol=TCP localport=21113,21114,21115
          netsh advfirewall firewall add rule name="MonectUDP" dir=in action=allow protocol=UDP localport=21113,21114,21115

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=========================================="
          Write-Host "     VIRTUAL GAMING RUNNER STATUS: LIVE   "
          Write-Host "=========================================="
          Write-Host "Tailscale Interface IP Address: $env:TAILSCALE_IP"
          Write-Host "Target RDP Access Account User: $env:RDP_USER"
          Write-Host "Target RDP Access Account Pass: $env:RDP_PASS"
          Write-Host "==========================================`n"
          
          while (\$true) {
              Write-Host "[\$(Get-Date)] KeepAlive Loop Monitor Active - Stream Transport Clear"
              Start-Sleep -Seconds 300
          }
          
