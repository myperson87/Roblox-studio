name: Virtual Gaming Server - Monect Edition

on:
  workflow_dispatch: # Allows you to manually launch the virtual instance from the GitHub Actions UI

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop services..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          # Clean up any existing custom rules before adding new ones
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>\$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          Write-Host "Generating dynamic administrative credentials..."
          \(charSet = @{               Upper   = [char[]](65..90)               Lower   = [char[]](97..122)               Number  = [char[]](48..57)               Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))           }\)rawPassword = @()
          rawPassword += charSet.Upper | Get-Random -Count 4
          rawPassword += charSet.Lower | Get-Random -Count 4
          rawPassword += charSet.Number | Get-Random -Count 4
          rawPassword += charSet.Special | Get-Random -Count 4
          
          password = -join (rawPassword | Sort-Object { Get-Random })
          securePass = ConvertTo-SecureString password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password \$securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          
          echo "RDP_CREDS=User: RDP | Password: password" >> env:GITHUB_ENV

      - name: Install Tailscale VPN
        shell: powershell
        run: |
          Write-Host "Downloading Tailscale Agent..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          \$tsUrl = "https://tailscale.com"
          installerPath = "env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri tsUrl -OutFile installerPath -ErrorAction Stop
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item \$installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          Write-Host "Connecting to Tailscale private mesh network..."
          & "\(env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\){{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-gaming-runner-\(env:GITHUB_RUN_ID\)tsIP = \(null\)retries = 0
          while (-not tsIP -and retries -lt 10) {
              \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              \$retries++
          }
          
          if (-not \$tsIP) {
              Write-Error "Tailscale IP assignment timed out!"
              exit 1
          }
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV

      - name: Download & Silently Install Monect Receiver
        shell: powershell
        run: |
          Write-Host "Downloading Monect setup payload from public deployment cluster mirror..."
          # This distribution endpoint ensures the binary downloads completely without being blocked
          \$DownloadUrl = "https://githubusercontent.com"
          
          Invoke-WebRequest -Uri \$DownloadUrl -OutFile "PCRemoteReceiverSetup.exe" -ErrorAction Stop
          
          # Verify integrity of file to prevent execution layer crashes
          \$FileSize = (Get-Item "PCRemoteReceiverSetup.exe").Length
          if (\$FileSize -lt 5000000) {
              Write-Error "Download payload corrupted or truncated by host CDN framework."
              exit 1
          }
          
          Write-Host "Installing Monect completely silently..."
          \$InstallProcess = Start-Process -FilePath ".\PCRemoteReceiverSetup.exe" -ArgumentList "/S" -PassThru -Wait
          
          if (\$InstallProcess.ExitCode -ne 0) {
              Write-Error "Monect setup subsystem failed with system exit code: (InstallProcess.ExitCode)"
              exit 1
          }
          Write-Host "Monect environment deployed successfully."

      - name: Open Network Ports for Monect Connection
        shell: powershell
        run: |
          Write-Host "Opening network firewall exceptions for Monect connection routing..."
          # Monect requires explicit routing exceptions over these ports to map phone inputs to the PC
          New-NetFirewallRule -DisplayName "Monect TCP Services" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 21113,21114,21115 -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Monect UDP Services" -Direction Inbound -Action Allow -Protocol UDP -LocalPort 21113,21114,21115 -ErrorAction SilentlyContinue

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=========================================="
          Write-Host "        GAMING PC RUNNER IS ONLINE        "
          Write-Host "=========================================="
          Write-Host "Tailscale IP Target: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Credentials: $env:RDP_CREDS"
          Write-Host "==========================================`n"
          
          # Keeps the workflow cloud container running up to the maximum timeout limit
          while (\$true) {
              Write-Host "[\$(Get-Date)] Server Monitoring Active - Connection Streams Healthy"
              Start-Sleep -Seconds 300
          }
          
