name: Spin Up Virtual Gaming Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          \(charSet = @{               Upper   = [char[]](65..90)               Lower   = [char[]](97..122)               Number  = [char[]](48..57)               Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))           }\)rawPassword = @()
          rawPassword += charSet.Upper | Get-Random -Count 4
          rawPassword += charSet.Lower | Get-Random -Count 4
          rawPassword += charSet.Number | Get-Random -Count 4
          rawPassword += charSet.Special | Get-Random -Count 4
          password = -join (rawPassword | Sort-Object { Get-Random })
          securePass = ConvertTo-SecureString password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password \$securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: password" >> env:GITHUB_ENV

      - name: Install Tailscale VPN
        run: |
          \$tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          installerPath = "env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri tsUrl -OutFile installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item \$installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "\(env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\){{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-gaming-runner-\(env:GITHUB_RUN_ID\)tsIP = \(null\)retries = 0
          while (-not tsIP -and retries -lt 10) {
              \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              \$retries++
          }
          if (-not \$tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV

      - name: Install Sunshine Gaming Server & Virtual Drivers
        run: |
          Write-Host "Initializing Chocolatey package installer..."
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org'))
          
          Write-Host "Downloading Sunshine and Virtual Gamepad Controller Drivers (ViGEmBus)..."
          # ViGEmBus allows the virtual container to read touch phone controls as a physical Xbox pad
          choco install sunshine vigembus -y
          
          Write-Host "Opening Sunshine communication port pathways..."
          netsh advfirewall firewall add rule name="Sunshine-Web" dir=in action=allow protocol=TCP localport=47984,47989,48010
          netsh advfirewall firewall add rule name="Sunshine-Stream" dir=in action=allow protocol=UDP localport=47998,47999,48000,48002,48014

      - name: Start Gaming Services and Maintain Connection
        run: |
          Write-Host "`n=== VIRTUAL GAMING INSTANCE IS LIVE ==="
          Write-Host "Tailscale Target Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "Sunshine Web Configuration Dashboard: https://$env:TAILSCALE_IP:47990"
          Write-Host "======================================`n"
          
          # Force start Sunshine in the user's active session layer
          Start-Process -FilePath "C:\Program Files\Sunshine\sunshine.exe" -WindowStyle Hidden
          
          while (\$true) {
              Write-Host "[\$(Get-Date)] Stream Services Running - Connected to Tailscale Profile"
              Start-Sleep -Seconds 300
          }
          
