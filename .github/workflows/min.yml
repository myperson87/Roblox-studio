name: Virtual Gaming Server - Monect Edition

on:
  workflow_dispatch: # Allows you to manually launch the virtual instance from the GitHub Actions UI

jobs:
  secure-rdp:
    runs-on: windows-2025 # Official valid image providing a Windows 11 matching environment
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          echo Enabling Remote Desktop services...
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          
          echo Cleaning and updating firewall configurations...
          netsh advfirewall firewall delete rule name="RDP-Tailscale" >nul 2>&1
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          echo Restarting TermService...
          net stop TermService /y
          net start TermService

      - name: Create RDP User with Secure Password
        shell: cmd
        run: |
          echo Generating administrative user account credentials...
          net user RDP "G@meOn2026!" /add /expires:never
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          
          echo RDP_USER=RDP >> %GITHUB_ENV%
          echo RDP_PASS=G@meOn2026! >> %GITHUB_ENV%

      - name: Install Tailscale VPN
        shell: powershell
        run: |
          Write-Host "Downloading Tailscale Client Agent..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          
          \$tsUrl = "https://tailscale.com"
          installerPath = "env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri tsUrl -OutFile installerPath -ErrorAction Stop
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item \$installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          Write-Host "Connecting runner instance node to Tailscale mesh fabric..."
          & "\(env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\){{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-gaming-runner-\({{ github.run_id }}\)tsIP = \(null\)retries = 0
          while (-not tsIP -and retries -lt 12) {
              \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              \$retries++
          }
          
          if (-not \$tsIP) {
              Write-Error "Tailscale mesh tunnel interface timed out!"
              exit 1
          }
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV

      - name: Download & Silently Install Monect Receiver
        shell: powershell
        run: |
          Write-Host "Downloading Monect system payload mirror branch..."
          \$DownloadUrl = "https://githubusercontent.com"
          
          Invoke-WebRequest -Uri \$DownloadUrl -OutFile "PCRemoteReceiverSetup.exe" -ErrorAction Stop
          
          \$FileSize = (Get-Item "PCRemoteReceiverSetup.exe").Length
          Write-Host "Download payload verification status: \$FileSize bytes received."
          if (\$FileSize -lt 5000000) {
              Write-Error "The host CDN block interrupted the binary transfer sequence."
              exit 1
          }
          
          Write-Host "Running silent Monect installation manager backend process..."
          \$InstallProcess = Start-Process -FilePath ".\PCRemoteReceiverSetup.exe" -ArgumentList "/S" -PassThru -Wait
          
          if (\$InstallProcess.ExitCode -ne 0) {
              Write-Error "Installation subsystem caught unexpected deployment error exit code"
              exit 1
          }
          Write-Host "Monect system platform initialized safely."

      - name: Open Network Ports for Monect Connection
        shell: cmd
        run: |
          echo Opening dedicated input communication lines for Monect Server mapping...
          netsh advfirewall firewall add rule name="MonectTCP" dir=in action=allow protocol=TCP localport=21113,21114,21115
          netsh advfirewall firewall add rule name="MonectUDP" dir=in action=allow protocol=UDP localport=21113,21114,21115

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=========================================="
          Write-Host "     VIRTUAL GAMING RUNNER STATUS: LIVE   "
          Write-Host "=========================================="
          Write-Host "Tailscale Interface IP Address: $env:TAILSCALE_IP"
          Write-Host "Target RDP Access Account User: $env:RDP_USER"
          Write-Host "Target RDP Access Account Pass: $env:RDP_PASS"
          Write-Host "==========================================`n"
          
          while (\$true) {
              Write-Host "[\$(Get-Date)] KeepAlive Loop Monitor Active - Stream Transport Clear"
              Start-Sleep -Seconds 300
          }
          
