name: Spin Up Virtual Monect Instance

on:
  workflow_dispatch: # Allows you to manually launch the virtual instance from the GitHub Actions UI

jobs:
  deploy-virtual-pc:
    runs-on: windows-latest # Launches a fresh cloud virtual machine
    timeout-minutes: 360     # Keeps the instance running for up to 6 hours

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Chocolatey Environment
        shell: powershell
        run: |
          Write-Host "Configuring execution policies and initializing package registry..."
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          
          # Initialize Chocolatey clean to manage package installs reliably
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org'))
          }

      - name: Install Monect PC Remote via Package Manager
        shell: powershell
        run: |
          Write-Host "Installing Monect PC Remote Receiver via automation registry..."
          # Using choco isolates the download from cloud blockages
          choco install monect-pc-remote -y --ignore-checksums || choco install pc-remote-receiver -y --ignore-checksums

          Write-Host "Verifying installation path structures..."
          Start-Sleep -Seconds 5

      - name: Configure Windows Firewall for Monect Ports
        shell: powershell
        run: |
          Write-Host "Opening network firewall exceptions for Monect connection routing..."
          New-NetFirewallRule -DisplayName "Monect Server Service" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 21113,21114,21115 -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Monect Server Service UDP" -Direction Inbound -Action Allow -Protocol UDP -LocalPort 21113,21114,21115 -ErrorAction SilentlyContinue

      - name: Expose Virtual Instance via Secure Tunnel
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }} # Ensure you save this token inside your repository secrets!
        run: |
          Write-Host "Installing Ngrok network agent..."
          choco install ngrok -y
          
          Write-Host "Authenticating Ngrok instance agent..."
          & "C:\Program Files\ngrok\ngrok.exe" config add-authtoken "$env:NGROK_AUTH_TOKEN"
          
          Write-Host "Starting secure tunnel proxy channel..."
          Start-Process -FilePath "C:\Program Files\ngrok\ngrok.exe" -ArgumentList "tcp 3389"

      - name: Output Connection Details and Maintain Instance
        shell: powershell
        run: |
          Write-Host "=========================================================="
          Write-Host "            VIRTUAL MACHINE CONNECTION DETAILS            "
          Write-Host "=========================================================="
          
          # Fetch public endpoint URL details assigned to this Ngrok tunnel agent
          Start-Sleep -Seconds 10
          try {
              $TunnelInfo = Invoke-RestMethod -Uri "http://127.0.0"
              $PublicURL = $TunnelInfo.tunnels.public_url
              Write-Host "Your Public Endpoint RDP URL is: $PublicURL"
          } catch {
              Write-Host "Warning: Ngrok status API could not be read instantly. Ensure your token is valid."
          }
          
          Write-Host "System Machine Host Name: $env:COMPUTERNAME"
          Write-Host "=========================================================="
          Write-Host "Connect over RDP using the address above to open Monect's GUI"
          Write-Host "and log into your account to grab your custom Pairing Connection ID!"
          Write-Host "=========================================================="
          
          # Keeps script active so the cloud deployment runner doesn't close down automatically
          while ($true) { Start-Sleep -Seconds 60 }
          
